[platformio]
src_dir = InventoryTerminal

[env:esp32-32e]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
  https://github.com/lovyan03/LovyanGFX.git#5438181440c71cf30bbdc347b0b1597ae3ebf77d
  https://github.com/bblanchon/ArduinoJson.git#40ee05c065ce248192c47eb37af7a70a6935dfa6
build_flags = -Wall -Wextra
