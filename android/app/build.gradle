plugins { id 'com.android.application' }
android {
    namespace 'ph.dronelab.inventory'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId 'ph.dronelab.inventory'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.2.0-rc.5'
        resValue 'string', 'app_name', 'Inventory'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    signingConfigs {
        candidate {
            def keyPath = System.getenv('INVENTORY_CANDIDATE_KEYSTORE')
            def passwordPath = System.getenv('INVENTORY_CANDIDATE_PASSWORD_FILE')
            if (keyPath && passwordPath) {
                storeFile file(keyPath)
                storePassword file(passwordPath).text.trim()
                keyAlias 'inventory-candidate'
                keyPassword file(passwordPath).text.trim()
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            resValue 'string', 'app_name', 'Inventory Preview'
            // Build the existing Preview identity without substituting a new certificate.
            if (project.findProperty('inventoryUnsignedPreview') == 'true') signingConfig = null
        }
        release { minifyEnabled false }
        candidate {
            initWith release
            applicationIdSuffix '.candidate'
            resValue 'string', 'app_name', 'Inventory Candidate'
            matchingFallbacks = ['release']
            signingConfig = System.getenv('INVENTORY_CANDIDATE_KEYSTORE') ? signingConfigs.candidate : null
        }
    }
    testOptions { unitTests.includeAndroidResources = true }
    lint { abortOnError true }
}
dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
