name: Publish Android unsigned build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-release.yml', 'android/release-request.json']
  pull_request:
    paths: ['.github/workflows/android-release.yml', 'android/release-request.json', 'android/scripts/package_unsigned_release.py', 'android/app/build.gradle']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify and build unsigned packages
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon -PinventoryUnsignedPreview=true testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease
      - name: Validate and package release assets
        working-directory: android
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/package_unsigned_release.py --source-commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: Inventory-unsigned-release-assets
          path: deliverables/publish/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Inventory-unsigned-release-evidence
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/evidence/
          if-no-files-found: error
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Inventory-unsigned-release-assets
          path: publish
      - name: Publish without replacing an existing release
        working-directory: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          version="$(python3 -c 'import glob,json; print(json.load(open(glob.glob("*BUILD-MANIFEST.json")[0]))["version"])')"
          tag="android-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to reuse it."
            exit 1
          fi
          sha256sum -c *SHA256SUMS.txt
          gh release create "$tag" ./* --repo "$GH_REPO" --target "$SOURCE_COMMIT" --prerelease --latest=false --title "Inventory Android v${version} — UNSIGNED build" --notes-file "Inventory-Android-v${version}-RELEASE-NOTES.md"
