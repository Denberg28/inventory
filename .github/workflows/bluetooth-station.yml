name: Bluetooth station verification and candidate delivery
on:
  push:
    paths: ['firmware/**', 'docs/BLUETOOTH-STATION.md', '.github/workflows/bluetooth-station.yml']
  pull_request:
    paths: ['firmware/**', 'android/**', '.github/workflows/bluetooth-station.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing draft station release tag (blank runs checks only)'
        required: false
        type: string
      apk_sha256:
        description: 'SHA-256 of the exact retained-key signed APK in that draft'
        required: false
        type: string
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: cd android && ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug lintRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: station-android-checks
          path: |
            android/app/build/reports/
            android/app/build/test-results/
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.19
      - run: pio run -d firmware
      - run: python -m unittest discover -s tests -q && python scripts/check_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: station-esp32-32e-build
          path: |
            firmware/.pio/build/esp32-32e/firmware.bin
            firmware/.pio/build/esp32-32e/bootloader.bin
            firmware/.pio/build/esp32-32e/partitions.bin
  installer:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STATION_RELEASE_TAG: ${{ inputs.release_tag }}
      STATION_APK_SHA256: ${{ inputs.apk_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;35.0.0' 'platform-tools'
      - name: Verify exact signed draft assets and source
        run: python3 scripts/verify_station_draft.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          script: python3 scripts/check_station_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: station-installer-evidence
          path: station-draft/*INSTALL-CHECK.json
  publish:
    needs: [android, firmware, installer]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STATION_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: station-installer-evidence
          path: evidence
      - name: Attach installation evidence and publish existing draft
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          tag = os.environ['STATION_RELEASE_TAG']
          assert re.fullmatch(r'station-v[0-9A-Za-z.\-]+', tag)
          r = json.loads(subprocess.check_output(['gh','release','view',tag,'--json','isDraft,isPrerelease']))
          assert r['isDraft'] is True
          subprocess.run(['gh','release','upload',tag,'evidence/Inventory-Station-INSTALL-CHECK.json'], check=True)
          subprocess.run(['gh','release','edit',tag,'--draft=false','--prerelease','--latest=false'], check=True)
          PY
